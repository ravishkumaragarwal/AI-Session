<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Every time, they said it was the end</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;1,8..60,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F1EE; --surface:#FFFFFF; --ink:#172033; --muted:#5B6577; --line:#D3D6DD;
  --fear:#B23A2E; --cur:#F2B41C; --cur-on:#172033;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13161F; --surface:#1E2230; --ink:#EEF1F6; --muted:#A1A9B8; --line:#323849; --fear:#F08A7C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13161F; --surface:#1E2230; --ink:#EEF1F6; --muted:#A1A9B8; --line:#323849; --fear:#F08A7C;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--display);font-size:18px;line-height:1.45;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cur);outline-offset:3px}

/* Timeline */
.topbar{display:flex;align-items:center;background:var(--surface);border-bottom:1px solid var(--line)}
.timeline{flex:1;min-width:0;display:flex;align-items:center;padding:12px clamp(12px,2vw,24px) 10px clamp(16px,4vw,48px);overflow-x:auto}
.fsb{flex:none;margin-right:clamp(12px,3vw,40px);width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.fsb:hover{border-color:var(--cur)}
.timeline button{background:none;border:0;cursor:pointer;padding:6px 4px;display:flex;align-items:center;gap:9px;color:var(--muted);font-weight:600;font-size:15px;white-space:nowrap}
.timeline .dot{width:13px;height:13px;border-radius:50%;border:2.5px solid var(--c);flex:none}
.timeline .rail{flex:1 1 16px;min-width:8px;height:3px;border-radius:2px;background:var(--line);margin:0 6px}
.timeline button.done,.timeline button.now{color:var(--ink)}
.timeline button.done .dot{background:var(--c)}
.timeline button.now .dot{background:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 28%,transparent)}
.timeline .pn{width:24px;height:24px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--c);flex:none}
.timeline button.done .pn,.timeline button.now .pn{background:var(--c);color:#fff}
.timeline button.now .pn{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 28%,transparent)}
.timeline .pt{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.timeline .pl{line-height:1}
.timeline button.now .pl{color:var(--c);font-weight:800}
.pdots{display:flex;gap:3px}
.pdots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.pdots i.d{background:color-mix(in srgb,var(--c) 55%,var(--line))}
.pdots i.n{background:var(--c);transform:scale(1.5)}

/* Stage */
.stage{position:relative;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none}
.slide{--era:#888;position:absolute;inset:0;display:none;padding:clamp(16px,3vh,40px) clamp(16px,4vw,56px);overflow-y:auto;background:color-mix(in srgb,var(--era) 11%,var(--bg))}
.slide.active{display:grid}

/* Era slides */
.era{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(20px,4vw,64px);align-items:center}
.year{font-weight:800;font-size:clamp(72px,12vw,176px);line-height:.85;letter-spacing:-.04em;margin:0;color:var(--era)}
.title{font-size:clamp(24px,2.6vw,38px);font-weight:600;margin:.35em 0 .6em;letter-spacing:-.01em;line-height:1.15}
.question{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(20px,2vw,28px);line-height:1.35;color:var(--muted);max-width:30ch;margin:0}
.lesson{display:inline-block;margin:1.1em 0 0;font-size:clamp(22px,2.4vw,34px);font-weight:800;line-height:1.15;color:#fff;background:var(--era);padding:.25em .5em .3em;border-radius:10px;max-width:22ch;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
.slide[data-step="2"] .lesson{opacity:1;transform:none}

.board{position:relative;min-height:min(62vh,560px);height:100%;max-height:660px;display:grid;place-items:center}
.pic{margin:0;display:flex;flex-direction:column;align-items:flex-end;transition:opacity .45s,transform .45s}
.pic img{display:block;max-width:min(100%,470px);max-height:52vh;width:auto;height:auto;border-radius:20px;box-shadow:18px 18px 0 var(--era);background:var(--surface)}
.pic figcaption{font-size:12px;color:var(--muted);margin-top:28px}
.slide[data-step="1"] .pic{opacity:.15;transform:scale(.95)}
.slide[data-step="2"] .pic{opacity:0;transform:scale(.9)}

.fears{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,2vh,22px);padding:8px;pointer-events:none}
.clip{align-self:center;background:var(--surface);border-top:6px solid var(--fear);padding:14px 22px 16px;max-width:30ch;font-family:var(--serif);font-weight:700;font-size:clamp(22px,2.3vw,32px);line-height:1.15;color:var(--fear);box-shadow:0 12px 30px -12px color-mix(in srgb,var(--ink) 40%,transparent);opacity:0;transform:translateY(14px) rotate(var(--r,0deg));transition:opacity .35s,transform .35s}
.clip:nth-child(odd){--r:-2deg;align-self:flex-start}
.clip:nth-child(even){--r:1.6deg;align-self:flex-end}
.slide[data-step="1"] .clip{opacity:1;transform:rotate(var(--r))}
.slide[data-step="1"] .clip:nth-child(2){transition-delay:.25s}
.slide[data-step="1"] .clip:nth-child(3){transition-delay:.5s}
.slide[data-step="1"] .clip:nth-child(4){transition-delay:.75s}
.slide[data-step="1"] .clip:nth-child(5){transition-delay:1s}

.happened{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;opacity:0;pointer-events:none;transition:opacity .45s}
.slide[data-step="2"] .happened{opacity:1;pointer-events:auto}
.happened h3{margin:0 0 .6em;font-size:clamp(18px,1.6vw,22px);font-weight:800;color:var(--era)}
.happened ul{list-style:none;margin:0;padding:0;display:grid;gap:clamp(8px,1.4vh,14px)}
.happened li{background:color-mix(in srgb,var(--era) 15%,var(--surface));border-left:6px solid var(--era);border-radius:4px 12px 12px 4px;padding:12px 18px;opacity:0;transform:translateX(16px);transition:opacity .35s,transform .35s}
.slide[data-step="2"] .happened li{opacity:1;transform:none}
.slide[data-step="2"] .happened li:nth-child(2){transition-delay:.15s}
.slide[data-step="2"] .happened li:nth-child(3){transition-delay:.3s}
.slide[data-step="2"] .happened li:nth-child(4){transition-delay:.45s}
.slide[data-step="2"] .happened li:nth-child(5){transition-delay:.6s}
.slide[data-step="2"] .happened li:nth-child(6){transition-delay:.75s}
.happened b{display:block;font-size:clamp(19px,1.7vw,24px);line-height:1.2}
.happened span{display:block;color:var(--muted);font-size:clamp(15px,1.15vw,17px);margin-top:2px}

.happened ul.two{grid-template-columns:1fr 1fr}
.co{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.co i{white-space:nowrap;font-style:normal;font-size:clamp(12px,.95vw,14px);font-weight:600;background:var(--era);color:#fff;padding:2px 9px 3px;border-radius:999px}
.collage{position:relative;width:min(100%,520px);aspect-ratio:1.08}
.collage img{position:absolute;object-fit:cover;border-radius:14px;box-shadow:10px 10px 0 var(--era);background:var(--surface)}
.collage .tag{position:absolute;background:var(--ink);color:var(--bg);font-weight:800;font-size:clamp(14px,1.15vw,17px);line-height:1.2;padding:8px 12px;border-radius:8px;max-width:62%;box-shadow:6px 6px 0 var(--era)}
.collage .chart{position:absolute;background:var(--surface);border-radius:12px;padding:8px 10px;box-shadow:8px 8px 0 var(--era)}
.collage .chart svg{display:block;width:100%;height:auto}
.collage .chart p{margin:2px 0 0;font-size:13px;font-weight:600;color:var(--fear)}
.c2008 .a{left:0;top:9%;width:66%;height:50%;transform:rotate(-3deg)}
.c2008 .b{right:0;top:0;width:38%;height:60%;transform:rotate(3deg)}
.c2008 .c{left:4%;bottom:3%;width:46%;height:28%;transform:rotate(2deg)}
.c2008 .chart{right:2%;bottom:5%;width:46%;transform:rotate(-1.5deg)}
.c2008 .tag{left:-2%;top:-2%;transform:rotate(-2deg)}
.c2020 .a{left:0;top:16%;width:80%;height:60%;transform:rotate(-2deg)}
.c2020 .b{right:0;top:2%;width:42%;aspect-ratio:1;height:auto;border-radius:50%}
.c2020 .tag{left:4%;bottom:4%;transform:rotate(1.5deg)}
.ratio{position:absolute;inset:0;background:color-mix(in srgb,var(--era) 11%,var(--bg));display:grid;align-content:center;gap:clamp(14px,3vh,28px);padding:clamp(16px,3vh,40px) clamp(16px,4vw,56px);opacity:0;pointer-events:none;transition:opacity .5s}
.slide.wiz[data-step="1"] .ratio{opacity:1}
.ratio h2{margin:0;font-size:clamp(28px,3.2vw,46px);font-weight:800;letter-spacing:-.025em;line-height:1.05}
.ratio .cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.6vw,22px);align-items:end}
.ratio .col{background:var(--surface);border-radius:16px;padding:clamp(12px,1.8vh,18px) clamp(12px,1.4vw,18px);display:flex;flex-direction:column;gap:10px}
.ratio .dots{display:grid;grid-template-columns:repeat(10,clamp(7px,.75vw,11px));gap:3px;align-content:end;min-height:calc(11 * (clamp(7px,.75vw,11px) + 3px))}
.ratio .dots i{aspect-ratio:1;border-radius:50%;background:color-mix(in srgb,var(--ink) 22%,var(--surface))}
.ratio .dots i.pm{background:var(--era)}
.ratio .num{font-size:clamp(34px,4vw,60px);font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--era)}
.ratio .when b{display:block;font-size:clamp(16px,1.35vw,20px)}
.ratio .when span{color:var(--muted);font-size:clamp(13px,1.05vw,15px)}
.ratio .key{color:var(--muted);font-size:14px;margin:0;display:flex;gap:16px;align-items:center}
.ratio .key i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.ratio .punch{justify-self:start;background:var(--era);color:#fff;font-weight:800;font-size:clamp(20px,2.2vw,32px);line-height:1.2;padding:.3em .6em .35em;border-radius:12px;margin:0}

/* How the PM job changed */
.sec-h h2{font-size:clamp(34px,4.2vw,62px);font-weight:800;letter-spacing:-.03em;line-height:1;margin:0}
.sec-h h2 span{color:var(--era)}
.sec-h p{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(18px,1.7vw,24px);color:var(--muted);margin:.4em 0 0}
.week,.build,.jd{grid-template-rows:auto auto auto;gap:clamp(12px,2.6vh,26px);align-content:center}
.rows{display:grid;gap:clamp(8px,1.5vh,14px)}
.row{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,7fr);gap:clamp(12px,2vw,24px);align-items:center}
.row .task{font-weight:600;font-size:clamp(17px,1.5vw,22px);line-height:1.2}
.row .task small{display:block;font-weight:500;font-size:clamp(13px,1vw,15px);color:var(--muted);opacity:0;transition:opacity .4s}
.week[data-step="1"] .row .task small{opacity:1}
.week .t-a{display:none}
.week[data-step="1"] .t-a{display:inline}
.week[data-step="1"] .t-b{display:none}
.track{position:relative;height:clamp(38px,6vh,52px);background:color-mix(in srgb,var(--ink) 6%,var(--surface));border-radius:10px;overflow:hidden}
.fill{position:absolute;top:0;bottom:0;left:0;width:100%;background:color-mix(in srgb,var(--ink) 22%,var(--surface));border-radius:10px;transition:width 1.1s cubic-bezier(.2,.8,.2,1),background .6s}
.week[data-step="1"] .fill{width:var(--w);background:var(--era)}
.week[data-step="1"] .row:nth-child(2) .fill{transition-delay:.12s}
.week[data-step="1"] .row:nth-child(3) .fill{transition-delay:.24s}
.week[data-step="1"] .row:nth-child(4) .fill{transition-delay:.36s}
.week[data-step="1"] .row:nth-child(5) .fill{transition-delay:.48s}
.track .lbl{position:absolute;top:50%;transform:translateY(-50%);font-weight:600;font-size:clamp(15px,1.25vw,19px);white-space:nowrap;transition:opacity .4s}
.lbl.l-then{left:14px}
.lbl.l-now{left:calc(var(--w) + 14px);opacity:0}
.week[data-step="1"] .lbl.l-then{opacity:0}
.week[data-step="1"] .lbl.l-now{opacity:1;transition-delay:.8s}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
.foot .lesson{margin:0}
.foot small{color:var(--muted);font-size:13px}
.week[data-step="1"] .lesson,.build[data-step="1"] .lesson{opacity:1;transform:none}
.demo-wrap{position:relative;min-height:min(56vh,470px);display:grid}
.demos{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2vw,28px);transition:opacity .4s}
.build[data-step="1"] .demos{opacity:0}
.dp{background:var(--surface);border-radius:18px;padding:clamp(16px,2.2vh,24px) clamp(16px,1.8vw,26px);display:flex;flex-direction:column;gap:10px;border-top:6px solid var(--ink)}
.dp.ai{border-top-color:var(--era)}
.dp h3{margin:0;font-size:clamp(20px,1.9vw,28px);font-weight:800;line-height:1.1}
.dp .cap2{margin:0;color:var(--muted);font-family:var(--serif);font-style:italic;font-size:clamp(16px,1.3vw,19px)}
.dp .doc{margin:4px 0 2px;font-size:clamp(14px,1.1vw,16px);color:var(--muted)}
.dp .doc b{color:var(--ink)}
.run{align-self:flex-start;border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--bg)}
.dp.ai .run{background:var(--era);color:#fff}
.out{list-style:none;margin:0;padding:0;display:grid;gap:6px;align-content:start;min-height:calc(4 * 44px)}
.out li{background:color-mix(in srgb,var(--ink) 6%,var(--surface));border-radius:8px;padding:8px 12px;font-weight:600;font-size:clamp(15px,1.25vw,18px);font-variant-numeric:tabular-nums;animation:pop .3s}
.out li.bad{background:color-mix(in srgb,var(--fear) 15%,var(--surface));color:var(--fear)}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}}
.qs{position:absolute;inset:0;display:grid;align-content:center;gap:clamp(12px,2vh,20px);opacity:0;pointer-events:none;transition:opacity .45s}
.build[data-step="1"] .qs{opacity:1;pointer-events:auto}
.qs h3{margin:0;font-size:clamp(22px,2.2vw,32px);font-weight:800}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.5vw,18px)}
.qgrid div{background:var(--surface);border-left:6px solid var(--era);border-radius:4px 14px 14px 4px;padding:14px 18px}
.qgrid b{display:block;font-size:clamp(19px,1.75vw,26px);line-height:1.15}
.qgrid span{display:block;color:var(--muted);font-size:clamp(14px,1.15vw,17px);margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(10px,1.4vw,18px)}
.flip{perspective:1100px;height:clamp(190px,34vh,280px)}
.flip .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .75s;transition-delay:calc(var(--k) * .13s)}
.jd[data-step="1"] .flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:clamp(14px,2vh,20px);display:flex;flex-direction:column;justify-content:space-between}
.face small{font-weight:700;font-size:14px}
.face p{margin:0;font-size:clamp(18px,1.65vw,26px);font-weight:800;line-height:1.15}
.front{background:var(--surface);border:2px dashed var(--line)}
.front small{color:var(--muted)}
.front p{font-family:var(--serif);font-weight:600;color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--fear) 60%,transparent)}
.back{background:var(--era);color:#fff;transform:rotateY(180deg);box-shadow:8px 8px 0 color-mix(in srgb,var(--era) 35%,transparent)}
.back small{opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:1.1em;max-width:1000px}
.chips span{background:var(--surface);border:2.5px solid var(--era);padding:.25em .8em .3em;border-radius:999px;font-weight:700;font-size:clamp(18px,1.9vw,28px)}
.same[data-step="1"] .after.s2{opacity:1;transform:none}
.same[data-step="1"] .note{opacity:1}

/* Stories */
.story{grid-template-columns:minmax(0,4fr) minmax(0,6fr);gap:clamp(20px,4vw,64px);align-items:center}
.kicker{font-weight:700;color:var(--muted);font-size:clamp(15px,1.2vw,18px);margin:0}
.sname{font-size:clamp(56px,7vw,108px);font-weight:800;letter-spacing:-.04em;line-height:.9;color:var(--era);margin:.08em 0 0}
.ssub{font-family:var(--serif);font-style:italic;font-weight:500;color:var(--muted);font-size:clamp(18px,1.6vw,24px);margin:.3em 0 .9em}
.beats{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.beats li{border-left:5px solid var(--line);padding:3px 0 3px 14px;opacity:.4;transition:opacity .35s,border-color .35s}
.beats li.done{opacity:.7}
.beats li.on{opacity:1;border-color:var(--era)}
.beats b{display:block;font-size:clamp(18px,1.6vw,23px);line-height:1.2}
.beats span{display:block;font-size:clamp(15px,1.2vw,18px);color:var(--muted);line-height:1.3}
.views{position:relative;display:grid;min-height:min(60vh,500px)}
.view{grid-area:1/1;align-self:center;opacity:0;transform:translateY(10px);transition:opacity .45s,transform .45s;pointer-events:none}
.view.show{opacity:1;transform:none;pointer-events:auto}
.flow{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(12px,2vw,24px);align-items:center}
.pile{display:grid;gap:12px}
.doc2{background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:700;font-size:clamp(16px,1.35vw,20px);display:flex;gap:12px;align-items:center;box-shadow:6px 6px 0 color-mix(in srgb,var(--era) 35%,transparent)}
.doc2:nth-child(odd){transform:rotate(-1.5deg)}
.doc2:nth-child(even){transform:rotate(1.2deg)}
.doc2 i{font-style:normal;font-size:1.4em}
.arrow{font-size:clamp(40px,4vw,60px);font-weight:800;color:var(--era)}
.erp{background:var(--ink);color:var(--bg);border-radius:18px;padding:clamp(16px,2.5vh,26px);text-align:center}
.erp i{font-style:normal;font-size:clamp(40px,4vw,60px);display:block}
.erp b{display:block;font-size:clamp(19px,1.7vw,25px);line-height:1.2;margin-top:.3em}
.erp span{display:block;opacity:.75;font-size:clamp(14px,1.1vw,17px);margin-top:.3em}
.stat .n{font-size:clamp(110px,15vw,220px);font-weight:800;letter-spacing:-.05em;line-height:.85;color:var(--era);margin:0}
.stat .lead{font-size:clamp(22px,2.2vw,32px);font-weight:600;line-height:1.25;margin:.4em 0 .8em;max-width:24ch}
.oops{display:inline-flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--fear) 14%,var(--surface));color:var(--fear);font-weight:800;font-size:clamp(20px,2vw,28px);padding:.35em .7em;border-radius:12px}
.rg{background:var(--surface);border-radius:18px;padding:clamp(12px,2vh,18px);box-shadow:12px 12px 0 color-mix(in srgb,var(--era) 30%,transparent)}
.rg table{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:clamp(14px,1.15vw,17px)}
.rg th{text-align:left;color:var(--muted);font-weight:600;font-size:13px;padding:0 10px}
.rg td{padding:9px 10px;font-weight:600}
.rg td:first-child{border-radius:8px 0 0 8px}
.rg td:last-child{border-radius:0 8px 8px 0}
.rg td.ok{background:color-mix(in srgb,#1F9D55 14%,var(--surface))}
.rg td.chk{background:color-mix(in srgb,#E3A008 30%,var(--surface))}
.rg td.miss{background:color-mix(in srgb,var(--fear) 16%,var(--surface));color:var(--fear)}
.rg td.plain{background:color-mix(in srgb,var(--ink) 5%,var(--surface))}
.rg .bar2{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.push{background:var(--era);color:#fff;font-weight:700;padding:8px 16px;border-radius:999px;font-size:15px}
.res{display:inline-block;margin-top:14px;background:var(--era);color:#fff;font-weight:800;font-size:clamp(18px,1.7vw,24px);padding:.3em .7em;border-radius:10px}
.chat{display:grid;gap:12px;max-width:560px}
.bub{padding:12px 16px;border-radius:18px;font-size:clamp(17px,1.45vw,22px);line-height:1.3;max-width:88%}
.bub.me2{justify-self:end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.bub.bot{background:var(--surface);border-bottom-left-radius:4px}
.bub.err{color:var(--fear);font-weight:600}
.chat small{color:var(--muted);font-size:14px}
.finds{display:grid;gap:14px}
.finds h3{margin:0;font-size:clamp(20px,1.9vw,28px);font-weight:800}
.fd{background:var(--surface);border-left:6px solid var(--era);border-radius:4px 14px 14px 4px;padding:14px 18px}
.fd b{display:block;font-size:clamp(19px,1.7vw,25px);line-height:1.2}
.fd span{display:block;color:var(--muted);font-size:clamp(15px,1.2vw,18px);margin-top:4px;line-height:1.3}
.fine{color:var(--muted);font-size:13px;margin:0}
.finds .res{justify-self:start;margin-top:4px}

.slide.story[data-step="3"] .lesson{opacity:1;transform:none}
.hw{position:relative;display:grid;grid-template-columns:auto 1fr;gap:clamp(14px,2vw,26px);align-items:center}
.hw img{display:block;width:clamp(260px,30vw,430px);height:auto;border-radius:6px;transform:rotate(-2deg);box-shadow:12px 12px 0 color-mix(in srgb,var(--era) 35%,transparent),0 10px 30px -10px rgba(0,0,0,.35)}
.also{display:grid;gap:10px}
.also p{margin:0;font-weight:600;font-size:clamp(17px,1.5vw,22px);line-height:1.25}
.also .pill{display:inline-block;background:var(--surface);border-radius:999px;padding:4px 12px;margin:0 6px 6px 0;font-size:clamp(13px,1.05vw,15px);font-weight:600}
.also .typed{background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;font-weight:700}
.read{display:grid;grid-template-columns:auto 1fr;gap:clamp(12px,1.6vw,20px);align-items:start}
.read .src{position:relative;width:clamp(170px,17vw,250px);border-radius:6px;overflow:hidden;box-shadow:8px 8px 0 color-mix(in srgb,var(--era) 35%,transparent)}
.read .src img{display:block;width:100%;height:auto}
.read .src::after{content:"";position:absolute;left:0;right:0;height:22%;top:-22%;background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--era) 45%,transparent),transparent)}
.view.show .read .src::after{animation:scan 1.6s ease-in-out 1}
@keyframes scan{to{top:100%}}
.ex{background:var(--surface);border-radius:16px;padding:12px 14px;display:grid;gap:8px}
.hdr{display:flex;flex-wrap:wrap;gap:6px}
.hdr span{font-size:clamp(12px,1vw,14px);font-weight:600;padding:4px 9px;border-radius:8px;background:color-mix(in srgb,#1F9D55 14%,var(--surface))}
.hdr em{font-style:normal;color:var(--muted);font-weight:500}
.ln{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:4px;opacity:0;transform:translateX(10px);transition:opacity .35s,transform .35s}
.ln>span.cf{background:none;padding:4px 0 4px 4px;display:flex;align-items:center}
.cf i{font-style:normal;font-weight:800;font-size:clamp(12px,1vw,14px);padding:3px 9px;border-radius:999px;color:#fff;background:#1F9D55}
.cf i.lo{background:#C98200}
.sum{font-size:clamp(13px,1.05vw,15px);font-weight:600;background:color-mix(in srgb,var(--era) 14%,var(--surface));border-radius:8px;padding:7px 10px;opacity:0;transition:opacity .4s 1.7s}
.view.show .sum{opacity:1}
.ex .bar2{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ex .bar2 .push{margin-left:auto;white-space:nowrap}
.view.show .ln{opacity:1;transform:none}
.view.show .ln:nth-of-type(2){transition-delay:.5s}
.view.show .ln:nth-of-type(3){transition-delay:.8s}
.view.show .ln:nth-of-type(4){transition-delay:1.1s}
.view.show .ln:nth-of-type(5){transition-delay:1.4s}
.ln>span{padding:6px 9px;font-weight:700;font-size:clamp(13px,1.08vw,16px);border-radius:7px;background:color-mix(in srgb,#1F9D55 14%,var(--surface))}
.ln>span.chk{background:color-mix(in srgb,#E3A008 30%,var(--surface))}
.ln>span.miss{background:color-mix(in srgb,var(--fear) 16%,var(--surface));color:var(--fear)}
.ln small{grid-column:1/-1;color:var(--muted);font-size:clamp(12px,.95vw,14px);padding:0 9px 2px}
.ln small b{color:var(--ink)}
.ex .bar2{margin-top:2px}
.fc{display:grid;gap:12px}
.fc-row{display:flex;align-items:stretch;gap:6px}
.fc-row.rev{flex-direction:row-reverse}
.node{flex:1 1 0;min-width:0;background:var(--surface);border-radius:12px;border-top:4px solid var(--era);padding:9px 11px}
.node i{font-style:normal;font-size:20px;display:block}
.node b{display:block;font-size:clamp(14px,1.15vw,17px);line-height:1.2}
.node small{display:block;color:var(--muted);font-size:clamp(12px,.92vw,14px);line-height:1.25;margin-top:2px}
.node.dec{background:var(--era);color:#fff;border-top-color:transparent;flex:.8 1 0}
.node.dec small{color:#fff;opacity:.85}
.fork{flex:1.4 1 0;display:grid;gap:6px}
.fork .node{flex:none}
.node.go{border-top-color:#1F9D55}
.node.hm{border-top-color:#E3A008}
.ar{align-self:center;color:var(--era);font-weight:800;font-size:22px;flex:none}
.down{text-align:right;color:var(--era);font-weight:800;font-size:22px;line-height:1;margin:-6px 8% -6px 0}
.band{background:color-mix(in srgb,var(--era) 16%,var(--surface));border-radius:12px;padding:10px 14px;font-weight:600;font-size:clamp(14px,1.15vw,17px);line-height:1.3}
.band b{color:var(--era)}

/* AI toolkit */
.tools{grid-template-rows:auto auto auto;gap:clamp(10px,2vh,20px);align-content:safe center}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.4vw,18px)}
.tile{text-align:left;cursor:pointer;background:var(--surface);border:0;border-radius:18px;padding:clamp(12px,2vh,18px) clamp(14px,1.5vw,20px);display:flex;flex-direction:column;gap:6px;border-top:6px solid var(--t);min-height:clamp(108px,17vh,150px)}
.tile .ic{font-size:clamp(24px,2.4vw,34px);line-height:1}
.tile b{font-size:clamp(19px,1.75vw,26px);line-height:1.15}
.tile .for{color:var(--muted);font-size:clamp(14px,1.1vw,16px);font-family:var(--serif);font-style:italic}
.tile .tl{display:none;flex-wrap:wrap;gap:5px;margin-top:auto}
.tile .tl i{font-style:normal;white-space:nowrap;background:var(--t);color:#fff;font-weight:700;font-size:clamp(13px,1.05vw,15px);padding:3px 10px 4px;border-radius:999px}
.tile .q{margin-top:auto;color:var(--muted);font-size:13px;font-weight:600;transition:opacity .2s}
.tile.open .tl,.tools[data-step="1"] .tile .tl{display:flex;animation:pop .35s both}
.tile.open .q,.tools[data-step="1"] .tile .q{display:none}
.tools[data-step="1"] .tile:nth-child(2) .tl{animation-delay:.1s}
.tools[data-step="1"] .tile:nth-child(3) .tl{animation-delay:.2s}
.tools[data-step="1"] .tile:nth-child(4) .tl{animation-delay:.3s}
.tools[data-step="1"] .tile:nth-child(5) .tl{animation-delay:.4s}
.tools[data-step="1"] .tile:nth-child(6) .tl{animation-delay:.5s}
.tools .foot .lesson{margin:0;max-width:none;font-size:clamp(18px,1.9vw,26px)}
.tools .sec-h h2{font-size:clamp(32px,3.8vw,56px)}
.models .tgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
.models .tile b{font-size:clamp(17px,1.5vw,22px)}
.models .pmq{grid-column:span 2}
.models .tile{min-height:0;padding:10px 16px 12px;gap:5px}
.models .tile .ic{font-size:clamp(20px,1.8vw,26px)}
.models .tgrid{gap:clamp(8px,1.1vw,14px)}
.models .tile .for{font-size:clamp(13px,1vw,15px)}
.pmq{background:var(--era);color:#fff;border-top-color:transparent;cursor:default;visibility:hidden}
.pmq .for{color:#fff;opacity:.92;font-style:normal;font-family:var(--display);font-weight:600;font-size:clamp(15px,1.25vw,18px);line-height:1.3}
.pmq small{opacity:.85;font-size:clamp(12px,.95vw,14px);line-height:1.3;margin-top:auto}
.tools[data-step="1"] .pmq{visibility:visible;animation:pop .4s both .6s}
.tl .pr{display:block;width:100%;background:color-mix(in srgb,var(--t) 14%,var(--surface));border-left:4px solid var(--t);padding:6px 10px;border-radius:6px;font-weight:600;font-size:clamp(13px,1.05vw,15px);line-height:1.3}
.tl .pr b{font-size:inherit;color:var(--t)}
.tools[data-step="1"] .lesson{opacity:1;transform:none}

/* Live voting */
.vote{position:absolute;right:clamp(16px,5vw,80px);top:50%;transform:translateY(-50%);width:clamp(220px,20vw,290px);background:var(--surface);color:var(--ink);border-radius:20px;padding:16px 18px 18px;text-align:center;box-shadow:12px 12px 0 var(--era);cursor:default}
.vote .vt{margin:0 0 10px;font-weight:800;font-size:clamp(17px,1.5vw,21px)}
.vote .qr{display:inline-block;background:#fff;padding:10px;border-radius:12px}
.vote .qr img,.vote .qr canvas{display:block;width:clamp(150px,14vw,210px)!important;height:auto!important}
.vote .vcode{margin:6px 0 0;font-size:clamp(12px,1vw,14px);color:var(--muted)}
.vote .vcode b{color:var(--ink)}
.vote .vlink{margin:10px 0 0;font-weight:700;font-size:clamp(13px,1.05vw,15px);word-break:break-all;color:var(--muted)}
.vset{display:grid;gap:8px;margin-top:4px}
.vset p{margin:0;font-size:13px;color:var(--muted)}
.vset input{font:inherit;font-size:14px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.vbtn{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:999px;padding:8px 14px;cursor:pointer;background:var(--era);color:var(--on)}
.vedit{margin-top:8px;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer}
.k5{margin:0 0 .6em;font-weight:800;font-size:clamp(15px,1.3vw,19px);color:var(--muted)}
.welcome .wk{margin:0 0 .4em;font-weight:800;font-size:clamp(18px,1.6vw,24px);opacity:.85}
.welcome .parts{display:flex;flex-wrap:wrap;gap:8px;margin-top:clamp(14px,3vh,30px)}
.welcome .parts span{font-weight:600;font-size:clamp(13px,1.05vw,15px);padding:5px 12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.45);opacity:.7}
.welcome .parts span.done{opacity:.45;text-decoration:line-through}
.welcome .parts span.now{opacity:1;background:#fff;color:var(--era);border-color:#fff}
@media (max-width:1000px){.vote{position:static;transform:none;margin-top:20px}}

/* Build activity */
.task{grid-template-rows:auto 1fr;gap:clamp(10px,2vh,20px);align-content:safe center}
.tk{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:clamp(14px,2vw,28px);align-items:start}
.tk-l{display:grid;gap:clamp(8px,1.4vh,12px)}
.pnl{background:var(--surface);border-radius:16px;padding:clamp(10px,1.6vh,14px) 16px}
.pnl h3{margin:0 0 8px;font-size:clamp(15px,1.25vw,18px);font-weight:800;color:var(--era)}
.probs{display:flex;flex-wrap:wrap;gap:6px}
.probs span{font-weight:700;font-size:clamp(13px,1.05vw,15px);padding:5px 11px;border-radius:999px;background:color-mix(in srgb,var(--era) 14%,var(--surface))}
.tools3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tools3 div{border-left:4px solid var(--era);padding:2px 10px}
.tools3 b{display:block;font-size:clamp(15px,1.25vw,18px)}
.tools3 span{display:block;font-size:clamp(12px,.95vw,14px);color:var(--muted);line-height:1.3;margin-top:2px}
.tpl{font-size:clamp(15px,1.3vw,19px);line-height:1.5;margin:0;font-family:var(--serif)}
.tpl mark{background:color-mix(in srgb,var(--era) 22%,transparent);color:inherit;padding:0 5px;border-radius:5px;font-family:var(--display);font-weight:700}
.tpl-note{margin:8px 0 0;font-weight:700;font-size:clamp(12px,1vw,14px);color:var(--muted)}
.timer{background:var(--era);color:#fff;border-radius:20px;padding:16px;text-align:center;box-shadow:12px 12px 0 color-mix(in srgb,var(--era) 35%,transparent);cursor:default}
.timer .tl2{margin:0;font-weight:800;font-size:clamp(15px,1.3vw,19px);opacity:.9}
.timer .clock{font-size:clamp(56px,7vw,104px);font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;margin:6px 0 12px}
.timer.done .clock{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.tbtns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tbtns button{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:999px;padding:7px 14px;cursor:pointer;background:rgba(255,255,255,.22);color:#fff}
.tbtns .go{background:#fff;color:var(--era)}
.flow4{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:6px}
.flow4 li{display:flex;gap:10px;align-items:baseline;background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;font-size:clamp(14px,1.1vw,16px)}
.flow4 b{color:var(--era);min-width:3.4em}
@media (max-width:820px){.tk,.tools3{grid-template-columns:1fr}}

/* Hook and close */
.big{align-content:safe center;justify-items:start}
.big>*{max-width:1100px}
.big h1{font-size:clamp(64px,11vw,160px);font-weight:800;line-height:.9;letter-spacing:-.045em;margin:0}
.big.close h1{font-size:clamp(40px,5vw,76px)}
.big.close .sub{font-size:clamp(22px,2.4vw,34px)}
.big.close .after{font-size:clamp(20px,2.1vw,30px);margin-top:.8em}
.big.close .note{margin-top:1em}
.big.final .after.s2{color:#172033}
.big.final h1{font-size:clamp(44px,5.6vw,86px)}
.big.final .hands{width:clamp(56px,6vw,84px);font-size:clamp(30px,3.4vw,46px);margin-bottom:.1em}
.big.final .k5{margin-bottom:.4em}
.big.hook h1{font-size:clamp(56px,8.5vw,128px)}
.big.hook .hands{width:clamp(72px,8vw,110px);font-size:clamp(40px,4.5vw,60px);margin-bottom:.25em}
.big.hook .sub{font-size:clamp(24px,2.8vw,40px)}
.big.hook .after{font-size:clamp(22px,2.4vw,34px)}
.big.final .sub{font-size:clamp(22px,2.4vw,34px);max-width:32ch;margin-top:.35em}
.big.final .after{font-size:clamp(20px,2.1vw,30px);margin-top:.7em;max-width:36ch}
.big.final .note{margin-top:1em}
.big.final .note{font-size:clamp(18px,1.6vw,24px);font-weight:700;color:var(--ink)}
.brk{background:var(--era);color:var(--on);align-content:center;justify-items:start;gap:clamp(10px,2vh,18px)}
.brk .part{margin:0;font-weight:800;font-size:clamp(18px,1.6vw,24px);opacity:.85}
.brk h1{margin:0;font-size:clamp(60px,9vw,140px);font-weight:800;line-height:.92;letter-spacing:-.045em;max-width:14ch}
.brk .sub{margin:0;font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(20px,2vw,30px);opacity:.9;max-width:36ch}
.brk .parts{display:flex;flex-wrap:wrap;gap:8px;margin-top:clamp(10px,3vh,30px)}
.brk .parts span{font-weight:600;font-size:clamp(13px,1.05vw,15px);padding:5px 12px;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--on) 45%,transparent);opacity:.7}
.brk .parts span.done{opacity:.45;text-decoration:line-through}
.brk .parts span.now{opacity:1;background:var(--on);color:var(--era);border-color:var(--on)}
.big .sub{font-family:var(--serif);font-weight:600;font-size:clamp(26px,3.2vw,46px);line-height:1.2;max-width:24ch;margin:.5em 0 0}
.big .after{font-size:clamp(24px,2.8vw,40px);font-weight:600;line-height:1.2;max-width:28ch;margin:1em 0 0;opacity:0;transform:translateY(10px);transition:opacity .45s,transform .45s}
.big .after.s2{color:#fff;background:var(--era);font-weight:800;padding:.2em .5em .3em;border-radius:12px}
.big[data-step="1"] .after.s1,.big[data-step="2"] .after.s1,.big[data-step="2"] .after.s2{opacity:1;transform:none}
.big .note{color:var(--muted);font-size:clamp(16px,1.3vw,19px);margin-top:1.6em;opacity:0;transition:opacity .45s}
.big[data-step="2"] .note{opacity:1}
.hands{width:clamp(96px,11vw,150px);aspect-ratio:1;border-radius:50%;background:var(--era);display:grid;place-items:center;font-size:clamp(52px,6vw,84px);margin-bottom:.35em}
.bars{display:flex;gap:8px;margin-bottom:1.2em}
.bars i{width:clamp(36px,4vw,56px);height:10px;border-radius:5px;background:var(--c)}

/* Ladder */
.ladder{grid-template-rows:auto 1fr;gap:clamp(14px,3vh,32px);align-content:center}
.me{display:flex;align-items:center;gap:clamp(16px,2.5vw,34px);flex-wrap:wrap}
.photo{position:relative;width:clamp(104px,11vw,160px);aspect-ratio:1;border-radius:50%;padding:7px;background:conic-gradient(#F26B21,#1F9D55,#2F5BD3,#E0457B,#0FA3A3,#7A4FE0,#F26B21);flex:none}
.photo .pin{width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--surface);display:grid;place-items:center;position:relative}
.photo img{width:100%;height:100%;object-fit:cover;grid-area:1/1}
.photo .ini{font-weight:800;font-size:clamp(34px,3.6vw,54px);color:var(--muted);grid-area:1/1}
.photo .add{position:absolute;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--ink) 78%,transparent);color:var(--bg);font-size:12px;font-weight:600;text-align:center;padding:5px 0 10px;opacity:0;transition:opacity .2s}
.photo:hover .add,.photo:focus-within .add,.photo.empty .add{opacity:1}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
.me h2{font-size:clamp(36px,4.4vw,64px);font-weight:800;letter-spacing:-.03em;line-height:1;margin:0}
.me .role{font-size:clamp(19px,1.7vw,24px);font-weight:600;margin:.3em 0 0}
.me .role em{font-style:normal;background:var(--era);color:#172033;padding:.05em .4em .1em;border-radius:6px;margin-left:.3em;white-space:nowrap}
.me .line{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(18px,1.6vw,24px);color:var(--muted);margin:.35em 0 0}
.stairs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,1vw,14px);align-items:start}
.step{margin-top:calc((4 - var(--k)) * clamp(16px,4.5vh,40px))}
.cap{background:var(--c);color:#fff;border-radius:14px 14px 4px 4px;padding:10px 14px 12px}
.cap b{display:block;font-size:clamp(17px,1.55vw,23px);line-height:1.1}
.cap span{display:block;font-size:clamp(13px,1.05vw,15px);margin-top:3px;opacity:.95}
.body{background:var(--surface);border-radius:4px 4px 14px 14px;border-bottom:5px solid var(--c);padding:10px 14px 12px;opacity:0;transform:translateY(-6px);transition:opacity .4s,transform .4s;transition-delay:calc(var(--k) * .12s)}
.ladder[data-step="1"] .body{opacity:1;transform:none}
.body .chg{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:clamp(14px,1.08vw,16px);line-height:1.3;margin:0 0 .45em}
.body .did{font-size:clamp(15px,1.18vw,18px);font-weight:600;line-height:1.3;margin:0}
.body .pre{font-size:13px;font-weight:600;color:var(--c);margin:.55em 0 0;line-height:1.3}

/* WizCommerce */
.roleline{display:inline-block;font-weight:800;color:#fff;background:var(--era);padding:.15em .55em .2em;border-radius:8px;margin:0 0 .9em;font-size:clamp(16px,1.35vw,20px)}
.tn{display:grid;gap:clamp(12px,2vh,18px);width:100%}
.panel{border-radius:18px;padding:clamp(14px,2vh,20px) clamp(16px,1.8vw,24px)}
.panel h3{margin:0 0 .5em;font-size:clamp(17px,1.5vw,21px);font-weight:800}
.panel ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.then{background:var(--surface);border:2px dashed var(--line);color:var(--muted)}
.then ul{grid-template-columns:1fr 1fr;gap:6px 18px}
.then li{font-family:var(--serif);font-size:clamp(15px,1.2vw,18px);line-height:1.3;padding-left:1.1em;position:relative}
.then li::before{content:"✕";position:absolute;left:0;color:var(--fear);font-family:var(--display);font-weight:800}
.now{background:var(--era);color:#fff;box-shadow:14px 14px 0 color-mix(in srgb,var(--era) 35%,transparent)}
.now li b{display:block;font-size:clamp(18px,1.55vw,22px);line-height:1.2}
.now li span{display:block;font-size:clamp(14px,1.1vw,16px);opacity:.88}
.welcome{position:absolute;inset:0;background:var(--era);color:#fff;display:grid;align-content:center;justify-items:start;padding:clamp(16px,3vh,40px) clamp(16px,6vw,96px);opacity:0;pointer-events:none;transition:opacity .6s}
.slide.wiz[data-step="2"] .welcome{opacity:1}
.welcome h1{font-size:clamp(64px,10.5vw,170px);font-weight:800;line-height:.9;letter-spacing:-.045em;margin:0;max-width:9ch}
.welcome .sub{font-family:var(--serif);font-weight:600;font-size:clamp(22px,2.6vw,38px);line-height:1.25;max-width:30ch;margin:.7em 0 0;opacity:.92}

/* Controls */
.controls{display:flex;align-items:center;gap:12px;padding:10px clamp(16px,4vw,48px) 14px;border-top:1px solid var(--line);background:var(--surface)}
.controls .count{color:var(--muted);font-size:15px;margin-right:auto}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:600;font-size:16px}
.btn.primary{background:var(--cur);color:var(--cur-on);border-color:var(--cur)}
.btn:disabled{opacity:.4;cursor:default}
.hint{color:var(--muted);font-size:14px}
@media (max-width:820px){
  .happened ul.two,.ratio .cols,.cards{grid-template-columns:1fr 1fr}
  .demos,.qgrid{grid-template-columns:1fr}
  .story,.flow,.hw,.read{grid-template-columns:1fr}
  .tgrid{grid-template-columns:1fr 1fr}
  .fc-row,.fc-row.rev{flex-direction:column}
  .ar,.down{display:none}
  .row{grid-template-columns:1fr}
  body{overflow:auto}
  .era{grid-template-columns:1fr;align-items:start}
  .board{min-height:520px}
  .stairs{grid-template-columns:1fr}
  .step{margin-top:0}
  .then ul{grid-template-columns:1fr}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>

    c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,n,n);
    const url=c.toDataURL('image/jpeg',.86); setPhoto(url);
    try{ localStorage.setItem('soil-photo',url); }catch(err){}
  }; im.src=rd.result; };
  rd.readAsDataURL(f);
});

function fromHash(){ const m=/^#slide-(\d+)$/.exec(location.hash); if(m){const n=+m[1]-1; if(n>=0&&n<SLIDES.length){cur=n;step=0;}} }
let tLeft=900, tSet=900, tRun=null;
function tDraw(){ const c=document.getElementById('clock'); if(!c) return; c.textContent=String(Math.floor(tLeft/60)).padStart(2,'0')+':'+String(tLeft%60).padStart(2,'0'); document.getElementById('timer').classList.toggle('done',tLeft===0); const g=document.querySelector('#timer .go'); if(g) g.textContent=tRun?'Pause':'Start'; }
function tStop(){ clearInterval(tRun); tRun=null; }
document.addEventListener('click',e=>{
  const b=e.target.closest('#timer button'); if(!b) return;
  const t=b.dataset.t;
  if(t==='go'){ if(tRun) tStop(); else { if(tLeft===0) tLeft=tSet; tRun=setInterval(()=>{ tLeft=Math.max(0,tLeft-1); if(tLeft===0) tStop(); tDraw(); },1000); } }
  else if(t==='reset'){ tStop(); tLeft=tSet; }
  else { tStop(); tSet=tLeft=(+t)*60; }
  tDraw();
});
renderVotes(); fromHash(); update();
window.addEventListener('hashchange',()=>{const before=cur; fromHash(); if(cur!==before) update();});
</script>
